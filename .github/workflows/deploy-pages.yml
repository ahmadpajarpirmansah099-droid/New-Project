name: Deploy Waiting List preview

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/auth.js
          node --check assets/js/guestops-service.js
          node --check assets/js/app.js
          node --check assets/js/guestops-queue.js
          node --check assets/js/guestops-operational.js
          node --check assets/js/guestops-history.js
          node --check assets/js/guestops-reservations.js
          node --check assets/js/guestops-detail.js
          node --check assets/js/user-monitoring.js
          node --check assets/js/app-startup.js
          node --check assets/js/masterdata-store.js
          node --check assets/js/daily-stock-service.js
          node --check assets/js/daily-stock-ui.js
          node --check assets/js/masterdata-service.js
          node --check assets/js/masterdata-ui.js
          node --check assets/js/wip-service.js
          node --check assets/js/wip-ui.js
          node --check assets/js/menu-service.js
          node --check assets/js/menu-ui.js
      - name: Test frontend logic
        run: |
          node --test tests/guestops-service.test.js
          node --test tests/masterdata-phase1.test.js
          node --test tests/workspace-session.test.js
          node --test tests/guestops-access.test.js
          node --test tests/wip-phase2.test.js
          node --test tests/menu-phase3.test.js
          node --test tests/csv-export.test.js
          node --test tests/daily-stock-architecture.test.js

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add automatic asset cache version
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          pattern = re.compile(r'((?:href|src)="assets/[^"?]+)(?:\?[^"]*)?(")')
          updated, count = pattern.subn(
              lambda match: f"{match.group(1)}?v={os.environ['GITHUB_SHA']}{match.group(2)}",
              html,
          )
          if count == 0:
              raise SystemExit("No local CSS/JS assets found in index.html")
          index.write_text(updated, encoding="utf-8")
          print(f"Applied a fresh cache version to {count} local assets.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
