name: Deploy Waiting List preview

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Test frontend logic
        run: node --test tests/*.test.js

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add automatic asset cache version
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          pattern = re.compile(r'((?:href|src)="assets/[^"?]+)(?:\?[^"]*)?(")')
          updated, count = pattern.subn(
              lambda match: f"{match.group(1)}?v={os.environ['GITHUB_SHA']}{match.group(2)}",
              html,
          )
          if count == 0:
              raise SystemExit("No local CSS/JS assets found in index.html")
          index.write_text(updated, encoding="utf-8")
          print(f"Applied a fresh cache version to {count} local assets.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site files
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest service-worker.js assets _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
              f"/actions/runs/{os.environ['GH_RUN_ID']}/artifacts"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          expected = os.environ["PAGES_ARTIFACT_NAME"]

          for attempt in range(1, 13):
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      payload = json.load(response)
                  matches = [
                      artifact for artifact in payload.get("artifacts", [])
                      if artifact.get("name") == expected and not artifact.get("expired")
                  ]
                  if matches:
                      print(f"Artifact metadata is visible: {expected}")
                      raise SystemExit(0)
                  print(f"Attempt {attempt}/12: artifact not visible yet; waiting 5 seconds.")
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API returned HTTP {error.code}: {detail}")
              if attempt < 12:
                  time.sleep(5)

          raise SystemExit(f"Artifact {expected} was not visible after 60 seconds.")
          PY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
